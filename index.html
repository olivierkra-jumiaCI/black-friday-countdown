<div id="bf-countdown" style="background:#0c0b0b;color:#ffffff;text-align:center;padding:40px 15px;min-height:400px;box-sizing:border-box;font-family:Ubuntu,Arial,sans-serif;">

  <p style="font-size:16px;font-weight:bold;margin:0 0 12px;">
Rompre avec l'habitude de se contenter de moins...
  </p>

  <h1 style="font-size:42px;font-weight:bold;color:#ff6b00;margin:0 0 25px;line-height:1.2;">
Mise à niveau gratuite
  </h1>

  <div style="display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;">

    <div style="background:#191919;border:1px solid #333;border-radius:12px;padding:15px 12px;min-width:55px;">
      <div id="bf-days" style="font-size:32px;font-weight:bold;">00</div>
      <small style="font-size:9px;color:#bbbbbb;">JOURS</small>
    </div>

    <div style="font-size:25px;color:#ff6b00;">:</div>

    <div style="background:#191919;border:1px solid #333;border-radius:12px;padding:15px 12px;min-width:55px;">
      <div id="bf-hours" style="font-size:32px;font-weight:bold;">00</div>
      <small style="font-size:9px;color:#bbbbbb;">HEURES</small>
    </div>

    <div style="font-size:25px;color:#ff6b00;">:</div>

    <div style="background:#191919;border:1px solid #333;border-radius:12px;padding:15px 12px;min-width:55px;">
      <div id="bf-minutes" style="font-size:32px;font-weight:bold;">00</div>
      <small style="font-size:9px;color:#bbbbbb;">MINUTES</small>
    </div>

    <div style="font-size:25px;color:#ff6b00;">:</div>

    <div style="background:#191919;border:1px solid #333;border-radius:12px;padding:15px 12px;min-width:55px;">
      <div id="bf-seconds" style="font-size:32px;font-weight:bold;color:#ff6b00;">00</div>
      <small style="font-size:9px;color:#bbbbbb;">SECONDES</small>
    </div>

  </div>

  <a href="https://www.jumia.ci/mlp-dream-list/"
     style="display:inline-block;margin-top:28px;background:#ff941f;color:#111111;text-decoration:none;font-size:12px;font-weight:bold;padding:14px 24px;border-radius:30px;">
Créez votre liste de rêves pour le Black Friday
  </a>

  <p style="font-size:11px;font-weight:bold;margin-top:35px;">
    <span style="color:#ff6b00;">&#9733;</span> #JumiaBlackFriday
  </p>

</div>

<script>
(function () {
  var deadline = new Date("2026-10-29T23:59:00+00:00").getTime();

  function updateCountdown() {
    var now = new Date().getTime();
    var remaining = deadline - now;

    if (remaining <= 0) {
      document.getElementById("bf-days").innerHTML = "00";
      document.getElementById("bf-hours").innerHTML = "00";
      document.getElementById("bf-minutes").innerHTML = "00";
      document.getElementById("bf-seconds").innerHTML = "00";
      return;
    }

    document.getElementById("bf-days").innerHTML =
      String(Math.floor(remaining / 86400000)).padStart(2, "0");

    document.getElementById("bf-hours").innerHTML =
      String(Math.floor((remaining % 86400000) / 3600000)).padStart(2, "0");

    document.getElementById("bf-minutes").innerHTML =
      String(Math.floor((remaining % 3600000) / 60000)).padStart(2, "0");

    document.getElementById("bf-seconds").innerHTML =
      String(Math.floor((remaining % 60000) / 1000)).padStart(2, "0");
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
})();
</script>
