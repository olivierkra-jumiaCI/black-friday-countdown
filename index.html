<style>
  @keyframes bf-pulse {
    0%   { transform: scale(1);   opacity: 1; }
    50%  { transform: scale(1.15); opacity: 0.7; }
    100% { transform: scale(1);   opacity: 1; }
  }
  #bf-seconds {
    animation: bf-pulse 1s ease-in-out infinite;
    display: inline-block;
  }
</style>

<div id="bf-countdown" style="background:#0c0b0b;color:#ffffff;text-align:center;padding:60px 20px;min-height:400px;box-sizing:border-box;font-family:Ubuntu,Arial,sans-serif;">

  <p style="font-size:18px;font-weight:bold;margin:0 0 14px;">
    Rompre avec l'habitude de se contenter de moins...
  </p>

  <h1 style="font-size:58px;font-weight:bold;color:#ff6b00;margin:0 0 35px;line-height:1.2;">
    Mise à niveau gratuite
  </h1>

  <!-- Bloc unifié comme image 1 -->
  <div style="display:inline-flex;justify-content:center;align-items:center;background:#1a1a1a;border-radius:20px;padding:28px 40px;gap:0;">

    <div style="text-align:center;min-width:80px;">
      <div id="bf-days" style="font-size:58px;font-weight:bold;line-height:1;">00</div>
      <small style="font-size:11px;color:#bbbbbb;letter-spacing:1px;">JOURS</small>
    </div>

    <div style="font-size:50px;color:#ff6b00;padding:0 12px;line-height:1;margin-bottom:14px;">:</div>

    <div style="text-align:center;min-width:80px;">
      <div id="bf-hours" style="font-size:58px;font-weight:bold;line-height:1;">00</div>
      <small style="font-size:11px;color:#bbbbbb;letter-spacing:1px;">HEURES</small>
    </div>

    <div style="font-size:50px;color:#ff6b00;padding:0 12px;line-height:1;margin-bottom:14px;">:</div>

    <div style="text-align:center;min-width:80px;">
      <div id="bf-minutes" style="font-size:58px;font-weight:bold;line-height:1;">00</div>
      <small style="font-size:11px;color:#bbbbbb;letter-spacing:1px;">MINUTES</small>
    </div>

    <div style="font-size:50px;color:#ff6b00;padding:0 12px;line-height:1;margin-bottom:14px;">:</div>

    <div style="text-align:center;min-width:80px;">
      <div style="font-size:58px;font-weight:bold;color:#ff6b00;line-height:1;">
        <span id="bf-seconds">00</span>
      </div>
      <small style="font-size:11px;color:#bbbbbb;letter-spacing:1px;">SECONDES</small>
    </div>

  </div>

  <br>

  <a href="https://www.jumia.ci/mlp-dream-list/"
     style="display:inline-block;margin-top:35px;background:#ff941f;color:#111111;text-decoration:none;font-size:14px;font-weight:bold;padding:16px 32px;border-radius:30px;">
    Créez votre liste de rêves pour le Black Friday
  </a>

  <p style="font-size:12px;font-weight:bold;margin-top:35px;">
    <span style="color:#ff6b00;">&#9733;</span> #JumiaBlackFriday
  </p>

</div>

<script>
(function () {
  var deadline = new Date("2026-10-29T23:59:00+00:00").getTime();

  function updateCountdown() {
    var now = new Date().getTime();
    var remaining = deadline - now;

    if (remaining <= 0) {
      document.getElementById("bf-days").innerHTML = "00";
      document.getElementById("bf-hours").innerHTML = "00";
      document.getElementById("bf-minutes").innerHTML = "00";
      document.getElementById("bf-seconds").innerHTML = "00";
      return;
    }

    document.getElementById("bf-days").innerHTML =
      String(Math.floor(remaining / 86400000)).padStart(2, "0");

    document.getElementById("bf-hours").innerHTML =
      String(Math.floor((remaining % 86400000) / 3600000)).padStart(2, "0");

    document.getElementById("bf-minutes").innerHTML =
      String(Math.floor((remaining % 3600000) / 60000)).padStart(2, "0");

    document.getElementById("bf-seconds").innerHTML =
      String(Math.floor((remaining % 60000) / 1000)).padStart(2, "0");
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
})();
</script>
