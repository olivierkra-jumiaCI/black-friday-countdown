<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  @keyframes bf-pulse {
    0%   { transform: scale(1);    opacity: 1; }
    50%  { transform: scale(1.15); opacity: 0.7; }
    100% { transform: scale(1);    opacity: 1; }
  }

  #bf-seconds {
    animation: bf-pulse 1s ease-in-out infinite;
    display: inline-block;
  }

  #bf-countdown {
    background: #0c0b0b;
    color: #ffffff;
    text-align: center;
    padding: clamp(30px, 6vw, 60px) clamp(12px, 4vw, 20px);
    min-height: 400px;
    box-sizing: border-box;
    font-family: Ubuntu, Arial, sans-serif;
  }

  #bf-subtitle {
    font-size: clamp(13px, 2.5vw, 18px);
    font-weight: bold;
    margin: 0 0 12px;
  }

  #bf-title {
    font-size: clamp(28px, 6vw, 63px);
    font-weight: bold;
    color: #ff6b00;
    margin: 0 0 clamp(20px, 4vw, 40px);
    line-height: 1.2;
  }

  #bf-timer-block {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    background: #1a1a1a;
    border-radius: 24px;
    padding: clamp(14px, 3vw, 36px) clamp(10px, 4vw, 56px);
    gap: 0;
    max-width: 100%;
    box-sizing: border-box;
  }

  .bf-unit {
    text-align: center;
    min-width: clamp(52px, 13vw, 110px);
  }

  .bf-num {
    font-size: clamp(38px, 10vw, 90px);
    font-weight: bold;
    line-height: 1;
  }

  .bf-num-sec {
    font-size: clamp(38px, 10vw, 90px);
    font-weight: bold;
    color: #ff6b00;
    line-height: 1;
  }

  .bf-label {
    font-size: clamp(8px, 1.5vw, 13px);
    color: #bbbbbb;
    letter-spacing: 1px;
    display: block;
    margin-top: 4px;
  }

  .bf-sep {
    font-size: clamp(32px, 8vw, 80px);
    color: #ff6b00;
    padding: 0 clamp(6px, 1.5vw, 14px);
    line-height: 1;
    margin-bottom: clamp(12px, 2vw, 18px);
  }

  #bf-cta {
    display: inline-block;
    margin-top: clamp(20px, 4vw, 35px);
    background: #ff941f;
    color: #111111;
    text-decoration: none;
    font-size: clamp(11px, 2vw, 14px);
    font-weight: bold;
    padding: clamp(12px, 2vw, 16px) clamp(20px, 4vw, 32px);
    border-radius: 30px;
  }

  #bf-hashtag {
    font-size: clamp(10px, 1.8vw, 12px);
    font-weight: bold;
    margin-top: 30px;
  }
</style>

<div id="bf-countdown">

  <p id="bf-subtitle">
    Rompre avec l'habitude de se contenter de moins...
  </p>

  <h1 id="bf-title">
    🛒 Tes rêves. Ton prix. Ton moment.
  </h1>

  <div id="bf-timer-block">

    <div class="bf-unit">
      <div id="bf-days" class="bf-num">00</div>
      <small class="bf-label">JOURS</small>
    </div>

    <div class="bf-sep">:</div>

    <div class="bf-unit">
      <div id="bf-hours" class="bf-num">00</div>
      <small class="bf-label">HEURES</small>
    </div>

    <div class="bf-sep">:</div>

    <div class="bf-unit">
      <div id="bf-minutes" class="bf-num">00</div>
      <small class="bf-label">MINUTES</small>
    </div>

    <div class="bf-sep">:</div>

    <div class="bf-unit">
      <div class="bf-num-sec">
        <span id="bf-seconds">00</span>
      </div>
      <small class="bf-label">SECONDES</small>
    </div>

  </div>

  <br>

  <a id="bf-cta" href="https://www.jumia.ci/mlp-dream-list/">
    Créez votre liste de rêves pour le Black Friday
  </a>

  <p id="bf-hashtag">
    <span style="color:#ff6b00;">&#9733;</span> #JumiaBlackFriday
  </p>

</div>

<script>
(function () {
  var deadline = new Date("2026-10-29T23:59:00+00:00").getTime();

  function updateCountdown() {
    var now = new Date().getTime();
    var remaining = deadline - now;

    if (remaining <= 0) {
      document.getElementById("bf-days").innerHTML = "00";
      document.getElementById("bf-hours").innerHTML = "00";
      document.getElementById("bf-minutes").innerHTML = "00";
      document.getElementById("bf-seconds").innerHTML = "00";
      return;
    }

    document.getElementById("bf-days").innerHTML =
      String(Math.floor(remaining / 86400000)).padStart(2, "0");

    document.getElementById("bf-hours").innerHTML =
      String(Math.floor((remaining % 86400000) / 3600000)).padStart(2, "0");

    document.getElementById("bf-minutes").innerHTML =
      String(Math.floor((remaining % 3600000) / 60000)).padStart(2, "0");

    document.getElementById("bf-seconds").innerHTML =
      String(Math.floor((remaining % 60000) / 1000)).padStart(2, "0");
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
})();
</script>
